<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hedgonomy</title>
<meta name="description" content="Hedgonomy connects like-minded investors, buyers and those who embrace the sharing economy. Our future is shared. Beta soon.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{min-height:100vh;background:#0b2416;color:#e8f0e6;font-family:'Noto Serif',Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:80px 24px}
.hedgebg{position:absolute;inset:0;opacity:.14;pointer-events:none}
.monogram{width:clamp(110px,18vw,150px);height:clamp(110px,18vw,150px);border-radius:26px;margin-bottom:clamp(28px,5vh,42px);box-shadow:0 18px 60px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.08)}
h1{font-size:clamp(52px,10vw,88px);font-weight:700;letter-spacing:-2px;color:#f2f7ef;text-align:center}
.tag{margin-top:26px;font-size:clamp(18px,3vw,24px);color:#a9c4a4;max-width:760px;text-align:center;line-height:1.5;font-style:italic}
.pitch{margin-top:10px;font-size:clamp(14px,2.2vw,17px);font-family:'Noto Sans',Arial,sans-serif;color:#6f8f6d;letter-spacing:.4px;text-align:center;max-width:640px;line-height:1.6}
.mailto{margin-top:48px;display:inline-block;font-family:'Noto Sans',Arial,sans-serif;padding:18px 38px;font-size:clamp(15px,2.4vw,17px);font-weight:600;background:#7dbf6e;color:#0b2416;text-decoration:none;border-radius:999px;letter-spacing:.3px;transition:background .2s ease, transform .2s ease}
.mailto:hover{background:#93d283;transform:translateY(-2px)}
.badge{position:absolute;top:44px;font-family:'Noto Sans',Arial,sans-serif;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#7dbf6e;border:1px solid #2e5b3a;padding:8px 20px;border-radius:999px}
.foot{position:absolute;bottom:36px;font-family:'Noto Sans',Arial,sans-serif;font-size:13px;color:#4a6a4c;letter-spacing:1px}
</style>
</head>
<body>
<svg class="hedgebg" width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 1280 800" aria-hidden="true"><filter id="nz"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.10  0 0 0 0 0.35  0 0 0 0 0.15  0 0 0 0.9 0"/></filter><rect width="1280" height="800" filter="url(#nz)"/></svg>
<div class="badge">Beta soon</div>
<svg class="monogram" viewBox="0 0 150 150" role="img" aria-label="Hedgonomy hedge H monogram"><defs><filter id="hg"><feTurbulence type="fractalNoise" baseFrequency="0.22" numOctaves="4" seed="7" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="12"/></filter></defs>
<rect x="0" y="0" width="150" height="150" rx="28" fill="#123822"/>
<text x="75" y="112" font-family="Noto Serif, Georgia, serif" font-size="105" font-weight="700" text-anchor="middle" fill="#86c972" filter="url(#hg)">H</text></svg>
<h1>Hedgonomy</h1>
<div class="tag">&ldquo;Our future is shared. A hedge economy.&rdquo;</div>
<div class="pitch">Connecting like-minded investors, buyers and those who embrace the sharing economy.</div>
<a class="mailto" href="mailto:beta@hedgonomy.com">beta@hedgonomy.com</a>
<div class="foot">&copy; 2026 HEDGONOMY</div>
</body>
</html>
